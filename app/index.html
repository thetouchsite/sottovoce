/* =============================== the queue ============================== */
// Every file dropped, and every recording stopped, becomes a job here. They
// run one at a time on the server; this only follows them.

function jobStageText(j){
  if (j.state === 'error') return j.error || 'failed';
  if (j.state === 'done') return 'done';
  if (j.expected){
    const left = Math.max(0, j.expected - j.elapsed);
    return j.stage + ' · ' + Math.max(1, Math.round(j.duration / 60)) + ' min of audio · '
      + (left > 0 ? 'about ' + left + ' s left' : 'almost done');
  }
  return j.stage + '…';
}

function track(id, name){
  queue.push({id, name, state:'running', stage:'queued', expected:0, elapsed:0, duration:0});
  drawQueue();
  drawList();
  poll();
}

let polling = null;
function poll(){
  if (polling) return;
  polling = setInterval(async () => {
    const running = queue.filter(j => j.state === 'running');
    if (!running.length){ clearInterval(polling); polling = null; return; }
    let finished = null;
    for (const j of running){
      let s;
      try{ s = await (await fetch('/api/job/' + j.id)).json(); } catch(e){ continue; }
      if (s.error && !s.state){ j.state = 'error'; j.error = s.error; continue; }
      Object.assign(j, {state: s.state, stage: s.stage, expected: s.expected || 0,
                        elapsed: s.elapsed || 0, duration: s.duration || 0,
                        folder: s.folder, error: s.error});
      if (s.state === 'done') finished = j;
    }
    if (finished) await loadCalls();
    drawQueue();
    drawList();
    // One file dropped and waited for: open it as soon as it is ready. With
    // several, or if you went to read something else, the queue keeps an
    // "Open" link instead of pulling the screen away.
    if (finished && view === 'home' && !rec && queue.length === 1){
      queue.length = 0;
      openCall(finished.folder);
    }
  }, 1000);
}

function drawQueue(){
  const box = $('#home-queue');
  if (!box) return;
  box.textContent = '';
  if (!queue.length) return;
  const p = panel('Transcribing');
  const right = el('div', 'right');
  const running = queue.filter(j => j.state === 'running').length;
  right.textContent = running ? plural(running, 'job', 'jobs') + ' left, one at a time' : 'all done';
  if (!running){
    const clear = el('button', 'text-button');
    clear.type = 'button';
    clear.textContent = 'Clear';
    clear.onclick = () => { queue.length = 0; drawQueue(); };
    right.append(clear);
  }
  p.querySelector('header').append(right);
  const c = el('div', 'content');
  for (const j of queue){
    const row = el('div', 'queue-row');
    const name = el('span', 'qname');
    name.textContent = j.name;
    row.append(name);
    if (j.state === 'done' && j.folder){
      const o = el('button', 'secondary');
      o.type = 'button';
      o.textContent = 'Open';
      o.onclick = () => openCall(j.folder);
      row.append(o);
    } else row.append(el('span'));
    const st = el('span', 'qstage' + (j.state === 'error' ? ' error' : ''));
    st.textContent = jobStageText(j);
    row.append(st);
    if (j.state === 'running'){
      const bar = el('div', 'bar' + (j.expected ? '' : ' indeterminate'));
      const i = el('i');
      if (j.expected) i.style.width = (Math.min(0.97, j.elapsed / j.expected) * 100).toFixed(0) + '%';
      bar.append(i);
      row.append(bar);
    }
    c.append(row);
  }
  p.append(c);
  box.append(p);
}

// Files are added, not transcribed: they wait in the list, where they can
// be renamed, listened to, deleted, and transcribed when the choices are made.
const adding = [];
async function sendFiles(files){
  const added = [];
  for (const file of files){
    adding.push(file.name);
    drawList();
    const form = new FormData();
    form.append('file', file);
    try{
      const r = await (await fetch('/api/uploads', {method:'POST', body:form})).json();
      if (r.error) throw new Error(r.error);
      added.push(r.folder);
    } catch(e){
      queue.push({id:null, name:file.name, state:'error', error:e.message});
      drawQueue();
    } finally {
      adding.splice(adding.indexOf(file.name), 1);
    }
  }
  await loadCalls();
  if (added.length === 1) openCall(added[0]);
  else if (added.length && view !== 'home') showHome();
}

/* ============================ recording a call ========================== */
// Two tracks: your microphone on the left channel, the call's tab on the
// right. The server tells who spoke from them (transcribe.label_speakers).
// Pieces go to the server every five seconds, so a closed tab or a crashed
// browser loses seconds, not the call.

async function startRecording(name){
  const body = $('#record-body');
  const fail = msg => {
    drawRecordIdle(body);
    const v = el('p', 'rec-note error');
    v.textContent = msg;
    body.append(v);
  };
  let display, mic;
  try{
    display = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: {echoCancellation:false, noiseSuppression:false, autoGainControl:false},
      selfBrowserSurface: 'exclude', surfaceSwitching: 'include', systemAudio: 'include'});
  } catch(e){ return fail('Nothing was shared, so nothing is being recorded.'); }
  const tab = display.getAudioTracks()[0];
  if (!tab){
    display.getTracks().forEach(t => t.stop());
    return fail('The share came without sound. Pick the tab of your call and leave '
      + '“Also share tab audio” on.');
  }
  try{
    mic = await navigator.mediaDevices.getUserMedia(
      {audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  } catch(e){
    display.getTracks().forEach(t => t.stop());
    return fail('The microphone was not allowed: without it your voice would be missing.');
  }

  const ctx = new AudioContext();
  const merger = ctx.createChannelMerger(2);
  const micSrc = ctx.createMediaStreamSource(mic);
  const tabSrc = ctx.createMediaStreamSource(new MediaStream([tab]));
  micSrc.connect(merger, 0, 0);
  tabSrc.connect(merger, 0, 1);
  const dest = ctx.createMediaStreamDestination();
  dest.channelCount = 2;
  merger.connect(dest);
  const meters = [micSrc, tabSrc].map(src => {
    const a = ctx.createAnalyser();
    a.fftSize = 1024;
    src.connect(a);
    return a;
  });

  let id;
  try{
    id = (await (await fetch('/api/recordings', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, language: currentLanguage()})})).json()).id;
  } catch(e){
    display.getTracks().forEach(t => t.stop()); mic.getTracks().forEach(t => t.stop()); ctx.close();
    return fail('The server did not answer: is it still running?');
  }

  const recorder = new MediaRecorder(dest.stream, {mimeType: 'audio/webm;codecs=opus',
                                                   audioBitsPerSecond: 64000});
  rec = {id, name, recorder, ctx, display, mic, meters, started: Date.now(), pending: [],
         sending: false, sent: 0, quietTab: 0};

  // Pieces are sent in order, one at a time; a piece that fails stays at the
  // head of the line and is sent again with the next one.
  recorder.ondataavailable = e => { if (e.data && e.data.size){ rec.pending.push(e.data); flush(); } };
  async function flush(){
    if (!rec || rec.sending) return;
    rec.sending = true;
    while (rec.pending.length){
      try{
        const r = await fetch('/api/recordings/' + id + '/chunk', {method:'POST', body: rec.pending[0]});
        if (!r.ok) throw new Error('chunk refused');
        rec.sent += rec.pending.shift().size;
      } catch(e){ break; }
    }
    rec.sending = false;
  }
  rec.flush = flush;

  // Ending the share from the browser's own bar ends the recording too.
  tab.addEventListener('ended', () => rec && stopRecording(true));
  recorder.start(5000);
  window.addEventListener('beforeunload', warnLeaving);
  drawRecordLive();
  drawList();
}

function warnLeaving(e){ e.preventDefault(); e.returnValue = ''; }

function drawRecordLive(){
  const c = $('#record-body');
  if (!c || !rec) return;
  c.textContent = '';
  const live = el('div', 'live');
  live.innerHTML = '<i class="dot"></i><span class="clock num" id="rec-clock">00:00</span>'
    + '<span class="note" id="rec-sent"></span>';
  const m1 = el('div', 'meter');
  m1.innerHTML = '<span>You (microphone)</span><div class="track"><i id="lvl-0"></i></div>';
  const m2 = el('div', 'meter');
  m2.id = 'meter-tab';
  m2.innerHTML = '<span>The call (tab)</span><div class="track"><i id="lvl-1"></i></div>';
  const hint = el('p', 'rec-note');
  hint.id = 'rec-hint';
  hint.textContent = (rec.name ? '“' + rec.name + '” · ' : '')
    + 'Keep this page open. Switching to the call’s tab is fine.';
  const foot = el('div', 'rec-foot');
  foot.style.marginTop = '16px';
  const stop = el('button', 'primary stop');
  stop.type = 'button';
  stop.textContent = 'Stop and transcribe';
  stop.onclick = () => stopRecording(true);
  const cancel = el('button', 'text-button danger');
  cancel.type = 'button';
  cancel.textContent = 'Discard';
  cancel.onclick = () => { if (confirm(T('Discard this recording? Nothing will be kept.'))) stopRecording(false); };
  foot.append(stop, cancel);
  c.append(live, m1, m2, hint, foot);
  tickRecording();
}

function tickRecording(){
  if (!rec) return;
  const clock = $('#rec-clock');
  if (clock) clock.textContent = mmss((Date.now() - rec.started) / 1000);
  const sent = $('#rec-sent');
  if (sent) sent.textContent = megabytes(rec.sent) + ' saved';
  const buf = new Float32Array(1024);
  rec.meters.forEach((a, i) => {
    a.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    const level = Math.min(1, Math.sqrt(sum / buf.length) * 6);
    const bar = $('#lvl-' + i);
    if (bar) bar.style.width = (level * 100).toFixed(0) + '%';
    if (i === 1) rec.quietTab = level < 0.01 ? rec.quietTab + 1 : 0;
  });
  // Twenty seconds of nothing from the tab: the wrong tab, or its sound off.
  const hint = $('#rec-hint'), mt = $('#meter-tab');
  if (hint && rec.quietTab > 1200){
    hint.textContent = 'No sound from the call yet. If the others are talking, the tab may be the '
      + 'wrong one, or shared without its audio.';
    if (mt) mt.classList.add('quiet-tab');
  } else if (mt) mt.classList.remove('quiet-tab');
  requestAnimationFrame(tickRecording);
}

async function stopRecording(keep){
  const r = rec;
  if (!r || r.stopping) return;
  r.stopping = true;
  const stopped = new Promise(res => r.recorder.onstop = res);
  if (r.recorder.state !== 'inactive') r.recorder.stop();
  await stopped;
  // Wait for the last pieces to reach the server.
  for (let i = 0; i < 100 && (r.pending.length || r.sending); i++){
    await r.flush();
    await new Promise(res => setTimeout(res, 100));
  }
  r.display.getTracks().forEach(t => t.stop());
  r.mic.getTracks().forEach(t => t.stop());
  r.ctx.close();
  window.removeEventListener('beforeunload', warnLeaving);
  rec = null;

  if (!keep){
    await fetch('/api/recordings/' + r.id, {method:'DELETE'});
    drawRecordIdle();
    return;
  }
  const name = (r.name || 'Call ' + new Date(r.started).toISOString().slice(0, 16).replace('T', ' ')
    .replace(':', '.'));
  try{
    const j = await (await fetch('/api/recordings/' + r.id + '/finish', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, language: currentLanguage(), precise: precise(),
                            voices: voicesWanted()})})).json();
    if (j.error) throw new Error(j.error);
    if (view !== 'home') showHome();
    drawRecordIdle();
    track(j.job, name + '.webm');
  } catch(e){
    if (view !== 'home') showHome();
    drawRecordIdle();
    drawUnfinished();
    alert(T('The recording is saved, but could not be sent to transcription:') + ' ' + e.message
      + '. It is listed under “Interrupted recordings”.');
  }
}

/* ============================ the call strip ============================ */
// The element no other transcription tool has: the real duration as one band.
// Inside: where people speak, where an invented phrase was dropped, where a
// line was corrected. Click it and the audio goes there; while it plays, a
// 1px line marks the spot.
//
// Drawn from the real data of THIS call. Nothing is estimated and nothing is
// decoration.

const NS = 'http://www.w3.org/2000/svg';
const sv = (t, a) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

// A round step that falls inside the duration without leaving a stubby last
// interval, and never just two labels at the ends: they would hide when
// things happened.
function axisStep(d){
  for (const p of [15, 30, 60, 120, 300, 600, 900, 1800]) if (d / p <= 8) return p;
  return 3600;
}

function drawStrip(svg, axis, l){
  const W = 1008, BAND = 56, TOP = 6;
  svg.textContent = '';
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + (TOP + BAND + 6));
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('shape-rendering', 'crispEdges');
  const duration = l.duration || 1;
  const x = s => Math.max(0, Math.min(W, (s / duration) * W));

  // One viewBox unit stretched over 358 phone pixels becomes a third of a
  // pixel and disappears. Line width is counted in real pixels.
  const line = Math.max(1, W / Math.max(1, svg.getBoundingClientRect().width || W));

  // The band's ground is silence; speech is laid on top of it. Speech comes
  // from the AUDIO (l.speech, measured with ffmpeg), not from the text. If the
  // measurement is missing the band stays empty and the legend does not
  // mention speech: nothing is better than a full band that means nothing.
  svg.append(sv('rect', {x:0, y:TOP, width:W, height:BAND, fill:'#0e0d11'}));
  for (const t of (l.speech || [])){
    const a = x(t[0]), b = x(t[1]);
    svg.append(sv('rect', {x:a, y:TOP, width:Math.max(line, b - a), height:BAND,
                           fill:'#f2f2f3', 'fill-opacity':'.62'}));
  }
  // Dropped phrases: a line the full height, in the colour of a fault.
  for (const f of (l.phantoms || [])){
    const s = secondsOf(f.minute);
    if (s === null) continue;
    svg.append(sv('rect', {x:x(s), y:0, width:line, height:TOP + BAND + 6, fill:'#e5566f'}));
  }
  // Corrected lines: the same line in the accent, from the bottom.
  for (const c of (l.corrections || [])){
    svg.append(sv('rect', {x:x(c.seconds), y:TOP + BAND - 15, width:line, height:21, fill:'#4a8ad6'}));
  }
  const head = sv('rect', {x:0, y:0, width:line, height:TOP + BAND + 6, fill:'#ffffff'});
  head.style.display = 'none';
  svg.append(head);

  // The axis: a round step inside the duration, and the real duration at the
  // end. A tick is kept if there is room before the end label: 6% of the
  // width is about 58px on a desktop, enough for two labels side by side.
  axis.textContent = '';
  const step = axisStep(duration);
  const ticks = [];
  for (let s = 0; s <= duration - Math.max(step * 0.25, duration * 0.06); s += step) ticks.push(s);
  ticks.push(duration);
  ticks.forEach((s, i) => {
    const e = el('span');
    e.style.left = (s / duration * 100) + '%';
    e.textContent = mmss(s);
    // On a phone every other label goes, and so does one that would touch
    // the end label.
    const last = ticks.length - 1;
    if ((i % 2 === 1 && i !== last) || (i === last - 1 && (duration - s) / duration < 0.12))
      e.classList.add('minor');
    axis.append(e);
  });
  return {svg, head, x, duration};
}

/* ============================= opening a call =========================== */

async function openCall(name, jump){
  setView('call');
  openNow = name;
  drawList();
  $('#inner').innerHTML = '<p class="quiet">opening…</p>';
  let l;
  try{
    l = await (await fetch('/api/history/' + encodeURIComponent(name))).json();
    if (l.error) throw new Error(l.error);
  } catch(e){ return failure(e.message); }
  if (openNow !== name) return;                    // another call was clicked meanwhile
  if (l.pending) return showPending(l);
  pendingShown = null;
  show(l, jump);
}

function failure(msg){
  $('#inner').innerHTML = '<h1>It does not open</h1><p class="finding error">' + esc(msg) + '</p>';
}

// Who said a line, as the reader should see it: the name given to the voice,
// or "You" and "Them" for the two tracks, or "Voice 2".
function speakerName(l, sp){
  if (!sp) return '';
  const n = (l.speaker_names || {})[sp];
  if (n) return n;
  return sp === 'Me' ? 'You' : sp;
}
function speakerClass(sp){
  if (sp === 'Me') return 'me';
  const m = /^Voice (\d+)$/.exec(sp || '');
  return m ? 'v' + ((Number(m[1]) - 1) % 5 + 1) : '';
}

// The finding: the fact about THIS call to look at first. A bare number is not
// a finding, and every figure here says what it is counting.
function finding(l){
  const d = [];
  if (l.two_tracks){
    const me = l.segments.filter(s => s.speaker === 'Me').length;
    d.push('recorded on two tracks: ' + plural(me, 'line', 'lines') + ' from you, '
      + (l.segments.length - me) + ' from the others');
  }
  const voices = (l.speakers || []).filter(x => x.tag.startsWith('Voice ')).length;
  if (voices) d.push(voices + ' voices told apart' + (l.two_tracks ? ' on the call' : ''));
  else if (l.speakers_found === 1) d.push('one voice heard');
  const dropped = (l.phantoms || []).length;
  if (dropped) d.push(plural(dropped, 'invented phrase dropped from silence',
                                      'invented phrases dropped from silence'));
  if (l.names_corrected) d.push(plural(l.names_corrected, 'name corrected by the glossary',
                                                         'names corrected by the glossary'));
  // Lines touched by the glossary are not lines corrected by hand: counting
  // them together would inflate the one figure here that is worth something.
  const hand = (l.corrections || []).filter(c => c.source !== 'glossary').length;
  if (hand) d.push(plural(hand, 'line corrected by hand', 'lines corrected by hand'));
  const n = (l.suspicious || []).length;
  if (n) d.push(plural(n, 'phrase still to check', 'phrases still to check'));
  if (!d.length) return 'Nothing to flag: no phrase dropped, no name corrected.';
  return d.join(' · ');
}

function cell(label, v, unit){
  const none = (v === null || v === undefined || v === '');
  return '<div><dt>' + label + '</dt><dd class="' + (none ? 'none' : '') + '">'
    + (none ? '—' : esc(v) + (unit ? ' <u>' + unit + '</u>' : '')) + '</dd></div>';
}

// The legend names only the marks actually on the strip: a key without its
// mark sends you looking for something that is not there.
function legend(l){
  const e = el('div', 'legend');
  const keys = [];
  if (l.speech && l.speech.length) keys.push('<span><i class="k-speech"></i>speech</span>');
  if ((l.phantoms || []).length) keys.push('<span><i class="k-dropped"></i>phrase dropped</span>');
  if ((l.corrections || []).length) keys.push('<span><i class="k-corrected"></i>line corrected</span>');
  e.innerHTML = keys.join('');
  return e;
}

function downloadMenu(l){
  const base = '/api/history/' + encodeURIComponent(l.folder) + '/download';
  const m = el('details', 'menu');
  const s = el('summary', 'secondary');
  s.innerHTML = '<svg viewBox="0 0 14 14"><path d="M7 2v7M4 6l3 3 3-3M2.5 12h9"/></svg>Download';
  const list = el('div', 'menu-list');
  for (const [fmt, what] of [['md', 'to read, in paragraphs'], ['txt', 'line by line, timestamps'],
                             ['srt', 'subtitles'], ['vtt', 'subtitles for the web'],
                             ['json', 'lines and word timings']]){
    const a = el('a');
    a.href = base + '.' + fmt;
    a.innerHTML = '.' + fmt + '<span>' + what + '</span>';
    a.onclick = () => m.removeAttribute('open');
    list.append(a);
  }
  m.append(s, list);
  return m;
}
document.addEventListener('click', e => {
  document.querySelectorAll('details.menu[open]').forEach(m => { if (!m.contains(e.target)) m.removeAttribute('open'); });
});

function show(l, jump){
  // Totals come from the parts as shown: if a line was corrected, the count
  // written in info.json is one correction old.
  const words = l.segments.reduce((s, p) =>
    s + (p.text.trim() ? p.text.trim().split(/\s+/).length : 0), 0);
  const speed = l.seconds_taken ? l.duration / l.seconds_taken : null;

  const d = $('#inner');
  d.textContent = '';
  d.append(crumbs(l.name, true));

  const tr = el('div', 'title-row');
  const left = el('div');
  const h1 = el('h1');
  h1.textContent = l.name;
  h1.className = 'data';
  const fd = el('p', 'finding');
  fd.textContent = finding(l);
  left.append(h1, fd);
  const act = el('div', 'actions');
  act.append(downloadMenu(l), moreMenu(l, h1));
  tr.append(left, act);
  d.append(tr);

  const ps = panel('The call, minute by minute');
  ps.querySelector('header').append(legend(l));
  const svg = sv('svg', {id:'strip', role:'img', 'aria-label':
    'Strip of ' + mmss(l.duration) + ' of recording: speech, dropped phrases and '
    + 'corrected lines. Click to listen from that point.'});
  const axis = el('div', 'axis');
  axis.setAttribute('aria-hidden', 'true');
  const sb = el('div', 'strip-body');
  sb.append(svg, axis);
  ps.append(sb);
  d.append(ps);
  const st = drawStrip(svg, axis, l);

  // Phone only: the panels at the side end up below the whole transcript.
  const jumps = el('nav', 'jumps');
  jumps.setAttribute('aria-label', 'Go to');
  const addJump = (label, id, extra) => {
    const b = el('button');
    b.type = 'button';
    b.textContent = label;
    if (extra){ const x = el('b'); x.textContent = extra; b.append(x); }
    b.onclick = () => {
      const t = document.getElementById(id);
      if (t) t.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches
                                         ? 'auto' : 'smooth', block: 'start'});
    };
    jumps.append(b);
  };
  addJump('Transcript', 'p-reading');
  if ((l.speakers || []).length || (voicesAvail && l.audio)) addJump('Voices', 'p-voices');
  const sus = (l.suspicious || []).length;
  addJump('To check', 'p-check', sus ? String(sus) : '');
  addJump('Glossary', 'p-glossary');
  tr.after(jumps);

  const pf = el('div', 'panel');
  const dl = el('dl', 'figures');
  dl.innerHTML = cell('Duration', mmss(l.duration))
    + cell('Words', thousands(words))
    + cell('Language', languageName(l.language))
    + cell('Transcribed in', l.seconds_taken ? mmss(l.seconds_taken) : null)
    + cell('Speed', speed ? speed.toFixed(1) : null, '× real time')
    + cell('Names corrected', l.names_corrected === null || l.names_corrected === undefined
        ? null : l.names_corrected);
  pf.append(dl);
  d.append(pf);

  const split = el('div', 'split');
  split.append(readingPanel(l, st, jump), sidePanel(l, st));
  d.append(split);
}

// Rename and delete, for a call transcribed or waiting.
function moreMenu(l, h1){
  const m = el('details', 'menu more');
  const s = el('summary', 'secondary');
  s.setAttribute('aria-label', 'More: rename, delete');
  s.title = 'Rename or delete';
  s.innerHTML = '<svg viewBox="0 0 14 14"><circle cx="3" cy="7" r="1.1"/><circle cx="7" cy="7" r="1.1"/>'
    + '<circle cx="11" cy="7" r="1.1"/></svg>';
  const list = el('div', 'menu-list');
  const rn = el('button');
  rn.type = 'button';
  rn.textContent = 'Rename';
  rn.onclick = () => { m.removeAttribute('open'); renameInline(l, h1); };
  const del = el('button', 'danger');
  del.type = 'button';
  del.textContent = 'Delete…';
  del.onclick = () => { m.removeAttribute('open'); deleteCall(l); };
  list.append(rn, del);
  m.append(s, list);
  return m;
}

// A playing file is held open by the browser, and Windows will not move a
// folder with an open file in it: stop the players first.
function releaseAudio(){
  document.querySelectorAll('audio').forEach(a => { a.pause(); a.removeAttribute('src'); a.load(); });
}

function renameInline(l, h1){
  const box = el('div', 'rename');
  const i = el('input');
  i.value = String(l.name).replace(/\.[a-z0-9]{2,4}$/i, '');
  i.maxLength = 120;
  i.setAttribute('aria-label', 'New name');
  const ok = el('button', 'primary small');
  ok.type = 'button';
  ok.textContent = 'Save';
  const no = el('button', 'text-button');
  no.type = 'button';
  no.textContent = 'Cancel';
  const err = el('p', 'rec-note error');
  h1.replaceWith(box);
  box.append(i, ok, no);
  i.focus();
  i.select();
  const done = async save => {
    if (!save){ box.replaceWith(h1); return; }
    const name = i.value.trim();
    if (!name || name === l.name){ box.replaceWith(h1); return; }
    ok.disabled = true;
    releaseAudio();
    try{
      const r = await (await fetch('/api/history/' + encodeURIComponent(l.folder) + '/rename', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name})})).json();
      if (r.error) throw new Error(r.error);
      await loadCalls();
      openCall(r.folder);
    } catch(e){
      ok.disabled = false;
      err.textContent = e.message;
      box.append(err);
    }
  };
  ok.onclick = () => done(true);
  no.onclick = () => done(false);
  i.onkeydown = e => {
    if (e.key === 'Enter'){ e.preventDefault(); done(true); }
    // Esc closes the field, and must not also leave the call.
    if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); done(false); }
  };
}

async function deleteCall(l){
  if (!confirm(T('Delete this call?') + '\n\n' + l.name + '\n\n'
      + T('It is moved to the _deleted folder next to your transcripts: you can still get it back from there.'))) return;
  releaseAudio();
  try{
    const r = await (await fetch('/api/history/' + encodeURIComponent(l.folder), {method:'DELETE'})).json();
    if (r.error) throw new Error(r.error);
  } catch(e){ alert(T(e.message)); return; }
  await loadCalls();
  showHome();
}

// A call added and not transcribed yet: listen to it, rename it, choose how,
// transcribe it. Or follow it while it is being transcribed.
function showPending(l){
  pendingShown = {folder: l.folder, status: l.status};
  const d = $('#inner');
  d.textContent = '';
  d.append(crumbs(l.name, true));

  const tr = el('div', 'title-row');
  const left = el('div');
  const h1 = el('h1');
  h1.textContent = l.name;
  h1.className = 'data';
  const fd = el('p', 'finding');
  const when = (l.uploaded_at ? 'Added ' + l.uploaded_at : 'Added')
    + (l.duration ? ' · ' + mmss(l.duration) + ' of audio' : '');
  fd.textContent = l.status === 'waiting' ? when + ' · not transcribed yet. Choose how, then transcribe.'
    : l.status === 'failed' ? when + ' · the transcription failed: ' + (l.error || 'unknown error')
    : when + ' · being transcribed.';
  if (l.status === 'failed') fd.classList.add('error');
  left.append(h1, fd);
  const act = el('div', 'actions');
  act.append(moreMenu(l, h1));
  tr.append(left, act);
  d.append(tr);

  if (l.status === 'waiting' || l.status === 'failed'){
    d.append(optionsPanel());
    const go = el('div', 'go');
    const b = el('button', 'primary');
    b.type = 'button';
    b.dataset.need = 'model';
    b.dataset.label = l.status === 'failed' ? 'Transcribe again' : 'Transcribe';
    const note = el('p', 'rec-note');
    const estimate = () => {
      if (!l.duration) return '';
      const secs = l.duration / (precise() ? 3.8 : 7.0);
      return 'About ' + (secs < 90 ? Math.max(5, Math.round(secs / 5) * 5) + ' seconds'
                                   : Math.round(secs / 60) + ' minutes') + ' on this computer.';
    };
    note.textContent = estimate();
    d.addEventListener('change', () => { note.textContent = estimate(); });
    b.onclick = async () => {
      b.disabled = true;
      try{
        const r = await (await fetch('/api/transcribe/' + encodeURIComponent(l.folder), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(transcribeChoices())})).json();
        if (r.error) throw new Error(r.error);
        track(r.job, l.name);
        await loadCalls();
        openCall(l.folder);
      } catch(e){
        b.disabled = false;
        note.textContent = e.message;
        note.classList.add('error');
      }
    };
    go.append(b, note);
    d.append(go);
    refreshHomeButtons();
  } else {
    const pp = panel('Transcribing');
    const c = el('div', 'content');
    const stage = el('p', 'note');
    stage.id = 'pending-stage';
    const bar = el('div', 'bar' + (l.expected ? '' : ' indeterminate'));
    bar.id = 'pending-bar';
    bar.append(el('i'));
    c.append(stage, bar);
    pp.append(c);
    d.append(pp);
    updatePending({stage: l.stage, expected: l.expected, elapsed: l.elapsed, status: l.status});
  }

  if (l.audio){
    const pa = panel('The recording');
    pa.classList.add('recording');
    const c = el('div', 'content');
    const a = el('audio');
    a.controls = true;
    a.preload = 'metadata';
    a.src = '/api/audio/' + encodeURIComponent(l.folder);
    c.append(a);
    pa.append(c);
    d.append(pa);
  }
}

function updatePending(v){
  const stage = $('#pending-stage'), bar = $('#pending-bar');
  if (!stage || !bar) return;
  stage.textContent = v.status === 'queued' ? 'Waiting for the transcriptions before it.'
    : (v.stage || 'transcribing') + (v.expected
        ? ' · about ' + Math.max(1, v.expected - (v.elapsed || 0)) + ' s left' : '…');
  bar.classList.toggle('indeterminate', !v.expected);
  if (v.expected) bar.firstChild.style.width = Math.min(97, 100 * (v.elapsed || 0) / v.expected) + '%';
}

// The little markdown the summary uses: headings, lists, bold. Three forms do
// not need a library, and a library would mean one more file or a network call.
function fromMarkdown(t){
  const out = [];
  let list = false;
  const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (let line of String(t).split('\n')){
    line = line.replace(/\s+$/, '');
    const li = /^\s*[-*•]\s+(.*)$/.exec(line);
    if (li){
      if (!list){ out.push('<ul>'); list = true; }
      out.push('<li>' + bold(li[1]) + '</li>');
      continue;
    }
    if (list){ out.push('</ul>'); list = false; }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h){ out.push('<h3>' + bold(h[2]) + '</h3>'); continue; }
    if (!line.trim()) continue;
    out.push('<p>' + bold(line) + '</p>');
  }
  if (list) out.push('</ul>');
  return out.join('');
}

/* ======================== to check, and the glossary ==================== */

// Who speaks in the call, how long each one talks, and their names. Names
// are kept apart from the text (info.json): the lines say "Voice 2" and keep
// saying it, so a wrong name is undone by changing one field.
function voicesPanel(l){
  const p = panel('Voices');
  p.id = 'p-voices';
  const c = el('div', 'content');
  const speakers = l.speakers || [];
  if (speakers.length){
    const form = el('form');
    for (const x of speakers){
      const r = el('label', 'voice-row');
      const tag = el('span', 'tag ' + speakerClass(x.tag));
      tag.textContent = x.tag === 'Me' ? 'You' : x.tag;
      const i = el('input');
      i.type = 'text';
      i.maxLength = 40;
      i.name = x.tag;
      i.value = x.name || '';
      i.placeholder = x.tag === 'Me' ? 'You' : x.tag === 'Them' ? 'Name them' : 'Name this voice';
      i.setAttribute('aria-label', 'Name for ' + tag.textContent);
      const sm = el('small');
      sm.textContent = mmss(x.seconds) + ' talking · ' + plural(x.lines, 'line', 'lines');
      r.append(tag, i, sm);
      form.append(r);
    }
    const b = el('button', 'secondary foot-action');
    b.type = 'submit';
    b.textContent = 'Save names';
    form.append(b);
    form.onsubmit = async e => {
      e.preventDefault();
      const names = {};
      for (const i of form.querySelectorAll('input')) names[i.name] = i.value;
      b.disabled = true;
      try{
        const r = await (await fetch('/api/speakers/' + encodeURIComponent(l.folder), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({names})})).json();
        if (r.error) throw new Error(r.error);
        openCall(l.folder);
      } catch(err){ b.disabled = false; b.textContent = err.message; }
    };
    c.append(form);
  }
  // Calls transcribed without it: the voices can be told apart now, from the
  // recording in the folder, without transcribing again.
  const split = speakers.some(x => x.tag.startsWith('Voice '));
  if (voicesAvail && l.audio && !split){
    const box = el('div', 'voices-cta');
    const v = el('p', 'note');
    // About 2.5 seconds a minute of audio, measured; said up front, so a
    // minute of waiting does not look like a page that hung.
    const secs = Math.max(5, Math.round(l.duration / 24));
    const wait = secs < 60 ? Math.ceil(secs / 5) * 5 + ' seconds'
                           : plural(Math.round(secs / 60), 'minute', 'minutes');
    if (l.speakers_found === 1){
      v.textContent = l.two_tracks ? 'Only one voice was heard on the call side.'
                                   : 'Only one voice was heard in this call.';
      box.append(v);
    } else {
      v.textContent = l.two_tracks
        ? 'More than one person on the call? Separate their voices to tell them apart, '
          + 'instead of one Them.'
        : 'Who is speaking is not marked yet. Separate the voices to see Voice 1, Voice 2… '
          + 'on every line, then give them names.';
      const b = el('button', speakers.length ? 'secondary' : 'primary');
      b.type = 'button';
      b.textContent = 'Separate voices';
      const hint = el('p', 'rec-note');
      hint.textContent = 'Listens to the recording again, without transcribing it again: about '
        + wait + (voicesReady ? '.' : ', plus a 32 MB download the first time.');
      b.onclick = async () => {
        b.disabled = true;
        b.textContent = 'Listening for voices…';
        const bar = el('div', 'bar indeterminate');
        bar.append(el('i'));
        b.after(bar);
        try{
          const r = await (await fetch('/api/voices/' + encodeURIComponent(l.folder), {method:'POST'})).json();
          if (r.error) throw new Error(r.error);
          voicesReady = true;
          bar.remove();
          if (!r.changed){
            b.remove();
            hint.remove();
            v.textContent = 'Only one voice was heard' + (l.two_tracks ? ' on the call side' : '')
              + ', so nothing changed.';
            return;
          }
          await loadCalls();
          openCall(l.folder);
        } catch(err){
          bar.remove();
          b.disabled = false;
          b.textContent = 'Separate voices';
          hint.textContent = err.message;
          hint.classList.add('error');
        }
      };
      box.append(v, b, hint);
    }
    c.append(box);
  }
  if (!c.children.length) return null;
  p.append(c);
  return p;
}

function sidePanel(l, st){
  const col = el('div', 'side');
  // Who is speaking comes first: it changes how everything below is read,
  // and the action that marks it must be seen without scrolling.
  const vp = voicesPanel(l);
  if (vp) col.append(vp);

  const p = panel('To check');
  p.id = 'p-check';
  const n = (l.suspicious || []).length;
  if (n){
    const r = el('div', 'right');
    const a = el('span', 'pill-warn');
    a.textContent = plural(n, 'phrase', 'phrases');
    r.append(a);
    p.querySelector('header').append(r);
  }
  const c = el('div', 'content');
  if (!n){
    const v = el('p', 'empty');
    v.textContent = 'Nothing suspicious. The phrases Whisper invented on silence '
      + 'have already been dropped, and the strip above shows where.';
    c.append(v);
  } else {
    const g = el('p', 'note');
    g.textContent = 'Whisper learned from YouTube subtitles and sometimes repeats '
      + 'them on silence. These were said where the audio was not quiet, so they '
      + 'stayed: you decide.';
    c.append(g);
    for (const s of l.suspicious){
      const b = el('button', 'suspect');
      b.type = 'button';
      const tm = el('time', 'num');
      tm.textContent = mmss(s.start);
      const sp = el('span');
      sp.textContent = s.text;
      b.append(tm, sp);
      b.onclick = () => st.go && st.go(s.start);
      c.append(b);
    }
  }
  p.append(c);
  col.append(p);

  /* the glossary in this call: which names weigh in it and how much, because
     those are the ones to look after. Below it, a way to apply the table
     again when it grew after the transcription. */
  const g = panel('Glossary');
  g.id = 'p-glossary';
  const gc = el('div', 'content glossary-body');
  const many = l.names_corrected || 0;
  const names = l.names || [];
  const line = el('p', 'note');
  // Found is not the same as corrected: a name Whisper got right is in the
  // table below without anything having been fixed.
  line.textContent = many
    ? plural(many, 'name', 'names') + ' corrected in this transcript.'
    : names.length ? 'Names from the glossary in this call, all heard right:'
                   : 'No name corrected in this transcript.';
  gc.append(line);
  if (names.length){
    const t = el('table');
    const tb = el('tbody');
    for (const x of names){
      const r = el('tr');
      r.innerHTML = '<td class="data">' + esc(x.name) + '</td><td class="n">' + thousands(x.count) + '</td>';
      tb.append(r);
    }
    t.append(tb);
    gc.append(t);
  } else {
    const v = el('p', 'empty');
    v.style.marginTop = '12px';
    v.textContent = 'None of the names in the glossary appears in this call.';
    gc.append(v);
  }
  const b = el('button', 'secondary foot-action');
  b.type = 'button';
  b.textContent = 'Apply the glossary again';
  b.onclick = async () => {
    b.disabled = true;
    b.textContent = 'applying…';
    try{
      const r = await (await fetch('/api/reapply/' + encodeURIComponent(l.folder), {method:'POST'})).json();
      if (r.error) throw new Error(r.error);
      if (!r.corrected){ b.textContent = 'Already up to date'; return; }
      await loadCalls();
      openCall(l.folder);
    } catch(e){ b.textContent = e.message; }
  };
  gc.append(b);
  g.append(gc);
  col.append(g);
  return col;
}

/* ============================ the reading panel ========================= */
// Three views of the same panel: the summary, the text to read, the text line
// by line. The summary is the starting view when there is one; the transcript
// is one click away, in the same place, instead of below the fold.
//
// When the words have their timings, each word can be clicked to play from
// it, and the word being said is underlined as the audio plays.

function readingPanel(l, st, jump){
  const p = panel(null);
  p.classList.add('reading');
  p.id = 'p-reading';
  const h = p.querySelector('header');

  const tabs = el('div', 'tabs');
  tabs.setAttribute('role', 'tablist');
  const buttons = {};
  for (const [k, name] of [['summary', 'Summary'], ['read', 'Read'], ['lines', 'Line by line']]){
    const b = el('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    // "Lines" on a phone: the tabs and the player have to share one row.
    if (k === 'lines') b.innerHTML = '<span class="tab-long">Line by line</span><span class="tab-short">Lines</span>';
    else b.textContent = name;
    b.onclick = () => view_(k);
    buttons[k] = b;
    tabs.append(b);
  }
  h.append(tabs);

  const right = el('div', 'right');
  const context = el('div', 'context');
  right.append(context);

  let audio = null;
  if (l.audio){
    audio = el('audio');
    audio.preload = 'none';
    audio.src = '/api/audio/' + encodeURIComponent(l.folder);
    const player = el('div', 'player');
    const play = el('button');
    play.type = 'button';
    play.setAttribute('aria-label', 'Play');
    const clock = el('span', 'clock');
    clock.textContent = '00:00';
    const PLAY = '<svg viewBox="0 0 10 10"><path d="M1 0l8 5-8 5z"/></svg>';
    const PAUSE = '<svg viewBox="0 0 10 10"><path d="M1 0h3v10H1zM6 0h3v10H6z"/></svg>';
    play.innerHTML = PLAY;
    play.onclick = () => audio.paused ? audio.play().catch(cannotPlay) : audio.pause();
    audio.onplay = audio.onpause = () => {
      play.innerHTML = audio.paused ? PLAY : PAUSE;
      play.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
    };
    audio.ontimeupdate = () => { clock.textContent = mmss(audio.currentTime); follow(); };
    player.append(play, clock);
    right.append(player);
  }
  // Correcting by hand needs a way in without a mouse: double-click works
  // with one, and on a phone a double tap is not reliable. "Correct" turns
  // taps on a line into editing it instead of playing it.
  const fix = el('button', 'text-button');
  fix.type = 'button';
  fix.textContent = 'Correct';
  fix.hidden = true;
  let fixing = false;
  fix.onclick = () => {
    fixing = !fixing;
    fix.textContent = fixing ? 'Done' : 'Correct';
    box.classList.toggle('fixing', fixing);
  };
  const copy = el('button', 'text-button');
  copy.type = 'button';
  copy.textContent = 'Copy';
  right.append(fix, copy);
  h.append(right);

  const box = el('div', 'reader');
  p.append(box);
  const help = el('p', 'help');
  help.hidden = true;
  help.innerHTML = '<span class="desk-only">Click a word to listen from it · double-click a line, '
    + 'or press <b>Correct</b>, to fix it · <kbd>Enter</kbd> saves · <kbd>Esc</kbd> cancels.</span>'
    + '<span class="touch-only">Tap a word to listen from it · press <b>Correct</b>, then tap a '
    + 'line to fix it.</span> Every correction is kept with its before and after: it is the '
    + 'material a model can one day learn your calls from.';
  p.append(help);

  let current = null, summaryText = l.summary || null, last = null, lastWord = null;

  // play() returns a promise and the browser may reject it: a codec it cannot
  // read, or autoplay blocked. Unhandled, the button does nothing and the
  // error sits in a console nobody looks at.
  function cannotPlay(e){
    if (e && e.name === 'AbortError') return;     // a play interrupted by another
    const c = right.querySelector('.player .clock');
    if (c) c.textContent = 'cannot play this file';
  }

  // A line's text, as clickable words when their timings are known.
  function textOf(x){
    const sp = el('span');
    sp.className = 'text';
    if (x.words && x.words.length){
      x.words.forEach((w, i) => {
        if (i) sp.append(' ');
        const s = el('span', 'w');
        s.dataset.w = w[0];
        s.textContent = w[2];
        sp.append(s);
      });
    } else sp.textContent = x.text;
    return sp;
  }
  const row = (x, i) => {
    const e = el('p');
    e.dataset.t = x.start || 0;
    if (i !== undefined) e.dataset.i = i;
    const tm = el('time');
    tm.textContent = mmss(x.start);
    e.append(tm);
    if ((l.speakers || []).length){
      const who = el('span', 'who ' + speakerClass(x.speaker));
      who.textContent = speakerName(l, x.speaker);
      if (x.speaker) who.title = who.textContent;
      e.append(who);
    }
    e.append(textOf(x));
    return e;
  };
  function fill(items, dense){
    box.textContent = '';
    box.className = 'reader lines' + (dense ? '' : ' paras')
      + ((l.speakers || []).length ? ' whos' : '') + (fixing && dense ? ' fixing' : '');
    for (let i = 0; i < items.length; i++) box.append(row(items[i], dense ? i : undefined));
  }

  function view_(k){
    current = k;
    for (const q in buttons) buttons[q].setAttribute('aria-selected', String(q === k));
    help.hidden = (k !== 'lines');
    fix.hidden = (k !== 'lines');
    if (k !== 'lines' && fixing) fix.onclick();
    context.textContent = '';
    last = null; lastWord = null;
    if (k === 'read') fill(l.paragraphs, false);
    else if (k === 'lines') fill(l.segments, true);
    else showSummary();
    follow();
  }

  /* --- the summary --- */
  function redoButton(){
    const b = el('button', 'text-button');
    b.type = 'button';
    b.textContent = 'Redo';
    b.onclick = () => ask(true);
    return b;
  }
  function showSummary(){
    box.className = 'reader';
    box.textContent = '';
    if (summaryText){
      const r = el('div', 'summary');
      r.innerHTML = fromMarkdown(summaryText);
      box.append(r);
      if (llm && llm.available) context.append(redoButton());
      return;
    }
    const v = el('p', 'empty');
    if (llm && llm.available){
      v.textContent = 'Not asked for yet. ' + llm.model
        + ' will write it, here on this machine, in about twenty seconds.';
      const b = el('button', 'primary');
      b.type = 'button';
      b.style.marginTop = '14px';
      b.textContent = 'Summarize the call';
      b.onclick = () => ask(false);
      box.append(v, b);
    } else {
      v.textContent = 'A summary needs a language model running on this machine: '
        + 'LM Studio, Ollama or llama-server. None is answering, so there is nothing to ask.';
      box.append(v);
    }
  }
  async function ask(redo){
    box.className = 'reader';
    box.textContent = '';
    context.textContent = '';
    const w = el('p', 'quiet');
    w.style.padding = '14px 0';
    w.textContent = 'the model is reading the call…';
    box.append(w);
    try{
      const r = await (await fetch('/api/summary/' + encodeURIComponent(l.folder)
        + (redo ? '?redo=true' : ''), {method:'POST'})).json();
      if (r.error) throw new Error(r.error);
      summaryText = r.text;
      // You may have moved to the text meanwhile: the summary waits for you
      // there, without pulling the view away.
      if (current !== 'summary') return;
      showSummary();
      const s = el('span');
      s.textContent = r.model + ' · ' + r.seconds + ' s';
      context.prepend(s);
    } catch(e){
      if (current !== 'summary') return;
      box.textContent = '';
      const v = el('p', 'empty error');
      v.textContent = e.message;
      box.append(v);
    }
  }

  /* --- copying: whatever view you are looking at --- */
  copy.onclick = async () => {
    const who = x => x.speaker ? speakerName(l, x.speaker) + ': ' : '';
    const t = current === 'summary' ? (summaryText || '')
      : (current === 'lines' ? l.segments : l.paragraphs)
          .map(x => '[' + mmss(x.start) + '] ' + who(x) + x.text)
          .join(current === 'lines' ? '\n' : '\n\n');
    if (!t) return;
    await navigator.clipboard.writeText(t);
    copy.textContent = 'Copied';
    setTimeout(() => copy.textContent = 'Copy', 1500);
  };

  /* --- clicking plays: from the word if it has a time, else from the line --- */
  box.addEventListener('click', e => {
    if (fixing){
      const r = e.target.closest('p[data-i]');
      if (r && !e.target.closest('.edit-actions')) startEdit(r);
      return;
    }
    if (!audio || e.target.closest('[contenteditable=true]')) return;
    const w = e.target.closest('.w');
    const r = e.target.closest('p[data-t]');
    if (!r) return;
    audio.currentTime = parseFloat(w ? w.dataset.w : r.dataset.t);
    audio.play().catch(cannotPlay);
  });

  /* and what is playing stays marked with the same 1px line as everything
     else: the line on its left edge, the word underneath */
  function follow(){
    if (!audio || (audio.currentTime === 0 && audio.paused)) return;
    const t = audio.currentTime;
    st.head.style.display = '';
    st.head.setAttribute('x', st.x(t));
    let pick = null;
    for (const r of box.querySelectorAll('p[data-t]')){
      if (parseFloat(r.dataset.t) <= t) pick = r; else break;
    }
    if (pick !== last){
      if (last) last.classList.remove('playing');
      if (pick) pick.classList.add('playing');
      last = pick;
    }
    let word = null;
    if (pick) for (const w of pick.querySelectorAll('.w')){
      if (parseFloat(w.dataset.w) <= t + 0.05) word = w; else break;
    }
    if (word !== lastWord){
      if (lastWord) lastWord.classList.remove('now');
      if (word) word.classList.add('now');
      lastWord = word;
    }
  }

  /* --- the strip is also the audio's scrub bar --- */
  // Scrolls inside the panel, not the page: clicking the strip at the top must
  // not make the screen jump.
  st.go = s => {
    if (current === 'summary') view_('read');
    if (audio){ audio.currentTime = s; audio.play().catch(cannotPlay); }
    const r = [...box.querySelectorAll('p[data-t]')].reverse().find(x => parseFloat(x.dataset.t) <= s);
    if (!r) return;
    // On a phone the panel does not scroll by itself, the page does.
    if (box.scrollHeight > box.clientHeight + 4)
      box.scrollTop = Math.max(0, r.offsetTop - box.clientHeight / 2);
    else r.scrollIntoView({block: 'center'});
  };
  st.svg.onclick = e => {
    const r = st.svg.getBoundingClientRect();
    st.go(((e.clientX - r.left) / r.width) * st.duration);
  };

  /* --- correcting by hand: the operation that builds the dataset --------- */
  box.addEventListener('dblclick', e => {
    const r = e.target.closest('p[data-i]');
    if (r) startEdit(r);
  });

  function startEdit(r){
    const s = r.querySelector('span.text');
    if (s.isContentEditable) return;
    const before = s.textContent;
    s.contentEditable = 'true';
    s.focus();
    r.classList.add('editing');
    // Buttons as well as keys: a phone has no Esc. Pressing them must not
    // take the focus away first, or the blur would save before Cancel.
    const acts = el('span', 'edit-actions');
    const ok = el('button', 'primary small');
    ok.textContent = 'Save';
    const no = el('button', 'text-button');
    no.textContent = 'Cancel';
    for (const b of [ok, no]){ b.type = 'button'; b.onpointerdown = b.onmousedown = x => x.preventDefault(); }
    ok.onclick = () => close(true);
    no.onclick = () => close(false);
    acts.append(ok, no);
    r.append(acts);
    let closed = false;
    const close = async save => {
      if (closed) return;
      closed = true;
      s.contentEditable = 'false';
      const after = s.textContent.replace(/\s+/g, ' ').trim();
      const i = +r.dataset.i;
      if (!save || after === before.replace(/\s+/g, ' ').trim()){ r.replaceWith(row(l.segments[i], i)); return; }
      try{
        const q = await (await fetch('/api/correct/' + encodeURIComponent(l.folder), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({index: i, text: after})})).json();
        if (q.error) throw new Error(q.error);
        // The paragraph view must see the correction too: read it again from
        // disk, which is the source, instead of rebuilding it here.
        const fresh = await (await fetch('/api/history/' + encodeURIComponent(l.folder))).json();
        if (!fresh.error){ l.segments = fresh.segments; l.paragraphs = fresh.paragraphs; }
        const nr = row(l.segments[i], i);
        nr.classList.add('saved');
        r.replaceWith(nr);
        setTimeout(() => nr.classList.remove('saved'), 900);
      } catch(err){ r.replaceWith(row(l.segments[i], i)); }
    };
    s.onkeydown = x => {
      if (x.key === 'Enter'){ x.preventDefault(); close(true); }
      // Stopped here: Esc on a line cancels the correction, and must not
      // also travel up to the page and leave the call.
      if (x.key === 'Escape'){ x.preventDefault(); x.stopPropagation(); close(false); }
    };
    s.onblur = () => close(true);
  }

  view_(summaryText && !jump ? 'summary' : 'read');
  if (jump) setTimeout(() => st.go(jump), 60);
  return p;
}

/* ============================== the glossary ============================ */

async function showGlossary(){
  setView('glossary');
  openNow = null;
  drawList();
  const d = $('#inner');
  d.innerHTML = '<p class="quiet">opening…</p>';
  let g;
  try{
    g = await (await fetch('/api/glossary')).json();
    if (g.error) throw new Error(g.error);
  } catch(e){ return failure(e.message); }
  if (view !== 'glossary') return;
  d.textContent = '';
  d.append(crumbs('Name glossary'));

  const used = g.rules.filter(r => r.count).length;
  const tr = el('div', 'title-row');
  const left = el('div');
  const h1 = el('h1');
  h1.textContent = 'Name glossary';
  const fd = el('p', 'finding');
  fd.textContent = g.rules.length
    ? plural(g.rules.length, 'name', 'names') + ', ' + used + ' of them found in your calls. '
      + 'Names are corrected after transcription, not suggested before: given to '
      + 'Whisper as a prompt, they made the text worse instead of better.'
    : 'Empty. Add the names Whisper cannot know (clients, products, people) and '
      + 'the ways it gets them wrong.';
  left.append(h1, fd);
  tr.append(left);
  d.append(tr);

  const p = panel('The table');
  const c = el('div', 'content');
  if (g.rules.length){
    const t = el('table');
    t.innerHTML = '<thead><tr><th>Right name</th><th>How it gets written wrong</th>'
      + '<th class="n">Found in your calls</th></tr></thead>';
    const tb = el('tbody');
    for (const r of g.rules){
      const row = el('tr');
      row.innerHTML = '<td class="data">' + esc(r.right) + '</td>'
        + '<td class="variants data">' + r.variants.map(esc).join(', ') + '</td>'
        + '<td class="n">' + (r.count ? thousands(r.count)
            : '<span style="color:var(--muted)">—</span>') + '</td>';
      tb.append(row);
    }
    t.append(tb);
    c.append(t);
  }
  const form = el('form', 'form-row');
  form.innerHTML = '<div><label for="g-right">Right name</label>'
    + '<input id="g-right" required placeholder="e.g. Kubernetes"></div>'
    + '<div><label for="g-variants">How it gets written wrong, comma separated</label>'
    + '<input id="g-variants" required placeholder="e.g. Cuber Netis, Cubernetes"></div>'
    + '<button class="primary" type="submit">Add</button>';
  form.onsubmit = async e => {
    e.preventDefault();
    const right = $('#g-right').value.trim();
    const variants = $('#g-variants').value.split(',').map(s => s.trim()).filter(Boolean);
    if (!right || !variants.length) return;
    try{
      const r = await (await fetch('/api/glossary', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({right, variants})})).json();
      if (r.error) throw new Error(r.error);
      showGlossary();
    } catch(err){ alert(T(err.message)); }
  };
  c.append(form);
  p.append(c);
  d.append(p);
}

/* ============================== wiring ================================== */

$('#v-home').onclick = showHome;
$('#mark').onclick = showHome;
// Esc goes back to the start, unless a line is being corrected (there it
// cancels the correction) or a menu is open (there it closes the menu).
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || view === 'home') return;
  if (document.activeElement && (document.activeElement.isContentEditable
      || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) return;
  const menu = document.querySelector('details.menu[open]');
  if (menu){ menu.removeAttribute('open'); return; }
  showHome();
});
$('#new-button').onclick = showHome;
$('#v-glossary').onclick = showGlossary;
$('#open-list').onclick = () => $('#sidebar').classList.toggle('open');
// A drawer closes when you tap beside it, as drawers do.
document.addEventListener('click', e => {
  const sb = $('#sidebar');
  if (sb.classList.contains('open') && !sb.contains(e.target) && !e.target.closest('#open-list'))
    sb.classList.remove('open');
});

const canvas = $('#canvas');
canvas.addEventListener('dragover', e => { e.preventDefault(); canvas.classList.add('dragover'); });
canvas.addEventListener('dragleave', e => { if (!canvas.contains(e.relatedTarget)) canvas.classList.remove('dragover'); });
canvas.addEventListener('drop', e => {
  e.preventDefault();
  canvas.classList.remove('dragover');
  if (e.dataTransfer.files.length) sendFiles([...e.dataTransfer.files]);
});
// Onto the list too: that is where the files go.
const side = $('#sidebar');
side.addEventListener('dragover', e => {
  if (![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  side.classList.add('dragover');
});
side.addEventListener('dragleave', e => { if (!side.contains(e.relatedTarget)) side.classList.remove('dragover'); });
side.addEventListener('drop', e => {
  e.preventDefault();
  side.classList.remove('dragover');
  if (e.dataTransfer.files.length) sendFiles([...e.dataTransfer.files]);
});
$('#file').onchange = e => { if (e.target.files.length) sendFiles([...e.target.files]); e.target.value = ''; };

$('#shutdown').onclick = async () => {
  if (rec){ alert(T('A call is being recorded: stop it first.')); return; }
  if (!confirm(T('Stop the server? The VRAM is freed; start it again with Start.bat.'))) return;
  try{
    const r = await (await fetch('/api/shutdown', {method:'POST'})).json();
    if (r.error){ alert(T(r.error)); return; }
  } catch(e){ /* the server dies while answering: the normal case */ }
  document.body.innerHTML = '';
  document.body.style.gridTemplateColumns = '1fr';
  document.body.style.placeItems = 'center';
  const d = el('div');
  d.style.textAlign = 'center';
  d.innerHTML = '<h1 style="font-size:21px;margin-bottom:10px">Server stopped</h1>'
    + '<p style="color:#8a8c92;margin:0">The VRAM is free. To start it again: '
    + '<strong style="color:#fff">Start.bat</strong></p>';
  document.body.append(d);
};

/* ================================= start ================================ */
// The new transcription screen is drawn at once, before any answer from the
// server: the page is never blank, even while the model loads or the GPU is
// busy with another job.

showHome();
checkEngine();
checkLLM();
loadCalls();
</script>
</html>
