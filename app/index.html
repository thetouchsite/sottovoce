<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sottovoce</title>
<!-- The mark as the tab icon, inline: the page makes no requests of its own. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='5' fill='%23171719'/%3E%3Crect x='3' y='7' width='2.6' height='8' rx='1.3' fill='%234a8ad6'/%3E%3Crect x='9.7' y='3' width='2.6' height='16' rx='1.3' fill='%234a8ad6'/%3E%3Crect x='16.4' y='9' width='2.6' height='4' rx='1.3' fill='%234a8ad6'/%3E%3C/svg%3E">

<!--
  TWO SCREENS, TWO QUESTIONS.

  The page opens on NEW TRANSCRIPTION: "what do I want to turn into text?".
  Its two big blocks are the two ways in: files you already have, or a call
  you are about to have. Below them, what is running and the latest calls.
  It never opens a call by itself: a page that greets you with someone else's
  transcript makes starting a new one feel like a detour.

  A CALL answers "what was said, and where is the text uncertain?". The
  biggest block is the transcript, because it is the answer. Above it sits
  THE CALL STRIP: the real duration of the recording as a single band, with
  speech, silence, the invented phrases that were dropped and the lines
  corrected. Click it and the audio jumps there.

  THE FONTS ARE IN THE REPO, not on Google Fonts. A page that calls an outside
  server when it opens contradicts the one promise of this program (nothing
  leaves this machine) and would not open without a network. Public Sans,
  SIL Open Font License 1.1, 26 KB: app/fonts/.

  GRID ARITHMETIC at 1440, written down so it can be checked:
      1440 - 50 (rail) - 318 (call list) = 1072 canvas
      1072 - 2 x 32 (padding)            = 1008 usable
      1008 = 664 + 24 + 320    and   1008 = 492 + 24 + 492
  One gap value, 24, horizontally and vertically.
-->

<style>
  @font-face{font-family:"Public Sans";font-weight:400 700;font-style:normal;
    font-display:swap;src:url(fonts/public-sans-latin.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,
      U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,
      U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"Public Sans";font-weight:400 700;font-style:normal;
    font-display:swap;src:url(fonts/public-sans-latin-ext.woff2) format("woff2");
    unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,
      U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

  :root{
    --ground:#171719; --surface:#131217; --raised:#212023;
    --border:#222224; --rule:#1b1a1f; --control:#3a3a3e;
    --text:#ffffff; --muted:#8a8c92;
    --accent:#4a8ad6; --positive:#44a282; --negative:#e5566f; --warning:#d9a441;
    --chart-1:#f2f2f3;
    --pill-warning-bg:#2a2416; --pill-warning-ink:#d9a441;
    /* One pale tint per voice, never the accent: the accent is you. Five, then
       they repeat; a call with six people is rare enough to share a colour. */
    --voice-1:#8fd3b6; --voice-2:#f0b48a; --voice-3:#e8a0b4; --voice-4:#b8c27a; --voice-5:#d8c39a;
    --shadow:0 12px 28px rgba(0,0,0,.2);
    --radius-card:6px; --radius-control:999px; --radius-chip:4px;
    --rail:50px; --list:318px;
    --gap:24px; --pad:32px; --control-h:34px;
    --fs-title:26px; --fs-section:20px; --fs-kpi:20px; --fs-body:13px; --fs-small:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--text);
    font:400 var(--fs-body)/1.5 "Public Sans",Inter,system-ui,sans-serif;
    display:grid;grid-template-columns:var(--rail) var(--list) 1fr;
    overflow:hidden}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;font-weight:600}
  button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:1px solid var(--accent);outline-offset:2px}
  [hidden]{display:none !important}

  /* ---- the rail: the mark, two views, shutdown at the bottom ------------ */
  .rail{border-right:1px solid var(--border);display:flex;flex-direction:column;
    align-items:center;padding:14px 0 12px;gap:4px}
  .rail .mark{display:grid;margin-bottom:18px}
  .rail .mark svg{width:22px;height:22px;fill:initial;stroke:none}
  .rail button{width:34px;height:34px;display:grid;place-items:center;
    color:var(--muted);border-radius:var(--radius-card);position:relative}
  .rail button:hover{color:var(--text)}
  .rail button[aria-current=page]{color:var(--text)}
  /* The style's one move: every selection is the same 1px line in the accent,
     on the nearest edge. Here, the edge of the rail. */
  .rail button[aria-current=page]::after{content:"";position:absolute;
    right:-8px;top:5px;bottom:5px;width:1px;background:var(--accent)}
  .rail .bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
  .rail .lang{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
  .rail .lang:hover{color:var(--text)}
  .rail svg{width:17px;height:17px;fill:none;stroke:currentColor;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  /* ---- the call list ----------------------------------------------------- */
  .sidebar{border-right:1px solid var(--border);display:flex;
    flex-direction:column;min-height:0;background:var(--ground)}
  .sidebar>header{padding:18px 16px 12px}
  .sidebar h2{font-size:var(--fs-section);font-weight:400;color:var(--muted)}
  .engine{display:flex;align-items:center;gap:7px;font-size:var(--fs-small);
    color:var(--muted);margin:5px 0 0}
  .light{width:6px;height:6px;border-radius:50%;background:var(--warning);flex:none}
  .light.ok{background:var(--positive)} .light.no{background:var(--negative)}
  .new-row{padding:0 16px 10px}
  .new-row .secondary{width:100%;justify-content:center;color:var(--text)}
  .search-row{padding:0 16px 12px}
  #search{width:100%;height:var(--control-h);background:var(--surface);
    color:var(--text);border:1px solid var(--control);
    border-radius:var(--radius-control);padding:0 14px;font:inherit}
  #search::placeholder{color:var(--muted)}
  #search:focus{outline:none;border-color:var(--accent)}
  .list{overflow-y:auto;min-height:0;padding:0 8px 16px}
  .item{display:block;width:100%;text-align:left;padding:9px 8px;
    border-radius:var(--radius-card);position:relative;line-height:1.35}
  .item:hover{background:var(--surface)}
  .item[aria-current=true]{background:var(--raised)}
  .item[aria-current=true]::before{content:"";position:absolute;left:0;
    top:4px;bottom:4px;width:1px;background:var(--accent)}
  .item .name{display:block;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-weight:500}
  .item .meta{display:block;font-size:var(--fs-small);color:var(--muted);margin-top:2px}
  .item .meta .dropped{color:var(--warning)}
  .item.running .meta{color:var(--text)}
  /* What a call is waiting for, named: never a bare colour. Transcribed calls
     carry nothing, they are the normal case. */
  .state{display:inline-block;font-size:11px;line-height:18px;padding:0 7px;
    border-radius:var(--radius-chip);font-weight:500;white-space:nowrap}
  .state.waiting{background:var(--pill-warning-bg);color:var(--pill-warning-ink)}
  .state.working{background:#17263b;color:#8fb8ea}
  .state.failed{background:#33161c;color:var(--negative)}
  .item.adding .meta{color:var(--text)}
  .sidebar.dragover{box-shadow:inset 0 0 0 1px var(--accent)}
  .group{font-size:var(--fs-small);color:var(--muted);padding:14px 8px 6px;margin:0}
  .hit{display:flex;gap:10px;padding:5px 8px;border-radius:var(--radius-card);
    width:100%;text-align:left;line-height:1.4}
  .hit:hover{background:var(--surface)}
  .hit time{color:var(--muted);flex:none;font-size:var(--fs-small)}
  .hit span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hit mark{background:transparent;color:var(--text);font-weight:600}
  .quiet{color:var(--muted);padding:10px 8px;line-height:1.5;margin:0}

  /* ---- the canvas -------------------------------------------------------- */
  .canvas{overflow-y:auto;min-height:0;padding:var(--pad);position:relative}
  .canvas.dragover::after{content:"";position:fixed;
    inset:0 0 0 calc(var(--rail) + var(--list));
    border:1px solid var(--accent);pointer-events:none}
  .inner{max-width:1008px}

  /* The way back, where the eye looks for it: above the title. */
  .crumbs{display:flex;align-items:center;gap:8px;font-size:var(--fs-small);color:var(--muted);
    margin:-8px 0 10px}
  .crumbs button{color:var(--muted);padding:2px 0}
  .crumbs button:hover{color:var(--text)}
  .crumbs svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;margin-right:4px;vertical-align:-1px}
  .crumbs span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .title-row{display:flex;align-items:flex-start;gap:var(--gap);margin-bottom:var(--gap)}
  .title-row>div:first-child{min-width:0;flex:1}
  h1{font-size:var(--fs-title);letter-spacing:-.01em;overflow-wrap:anywhere}
  .finding{color:var(--muted);margin:6px 0 0;font-size:14px;line-height:1.5}
  .actions{display:flex;gap:8px;flex:none;align-items:center}
  .primary{background:var(--text);color:#000;font-weight:600;
    height:var(--control-h);padding:0 16px;border-radius:var(--radius-control)}
  /* Disabled but readable, and the label says why. */
  .primary:disabled{background:var(--raised);color:var(--muted);cursor:default}
  .primary.stop{background:var(--negative);color:#fff}
  .secondary{border:1px solid var(--control);height:var(--control-h);
    padding:0 14px;border-radius:var(--radius-control);display:inline-flex;
    align-items:center;gap:8px;text-decoration:none;color:var(--muted)}
  .secondary:hover{color:var(--text);border-color:var(--text)}
  .secondary svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  select.secondary{background:var(--surface);padding:0 12px}
  select.secondary option{background:var(--surface);color:var(--text)}
  /* The choices made before transcribing: one tile each, with what it does
     written on it. A bare checkbox with its explanation in a tooltip is a
     choice nobody understands, and nobody hovers to find out. */
  .options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .option{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:8px;
    background:var(--raised);border:1px solid transparent;cursor:pointer;min-width:0}
  .option:hover{border-color:var(--control)}
  .option.on{border-color:var(--accent)}
  .option div{min-width:0;flex:1}
  .option b{display:block;font-weight:500;font-size:14px;margin-bottom:3px}
  .option small{display:block;color:var(--muted);font-size:var(--fs-small);line-height:1.5}
  .option.language{cursor:default}
  .option.language:hover{border-color:transparent}
  .option select{width:100%;margin-top:8px}
  .switch{appearance:none;-webkit-appearance:none;flex:none;width:34px;height:20px;margin:1px 0 0;
    border-radius:999px;background:var(--control);position:relative;cursor:pointer;
    transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;
    border-radius:50%;background:var(--text);transition:transform .15s}
  .switch:checked{background:var(--accent)}
  .switch:checked::after{transform:translateX(14px)}
  .switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Words that depend on the hand: "click" and "drop" with a mouse, "tap" with
     a finger. A phone told to drop files or press Esc is told nothing. */
  @media (hover:hover), (pointer:fine){ .touch-only{display:none !important} }
  @media (hover:none) and (pointer:coarse){ .desk-only{display:none !important} }
  .options-summary{display:none}
  .tab-short{display:none}
  .jumps{display:none}
  .primary.small{height:30px;padding:0 14px;font-size:var(--fs-body)}
  .lines p.editing{flex-wrap:wrap}
  .edit-actions{flex-basis:100%;display:flex;align-items:center;gap:16px;margin:8px 0 2px 60px}
  .lines.whos .edit-actions{margin-left:148px}
  .reader.fixing p[data-i]{cursor:text}
  .reader.fixing p[data-i]:hover{background:var(--raised)}
  .voices-cta .primary{margin-top:14px}
  .voices-cta .bar{margin-top:14px}
  .voices-cta .rec-note{margin-top:8px}
  .text-button{color:var(--muted);text-decoration:none}
  .text-button:hover{color:var(--text)}
  .text-button.danger:hover{color:var(--negative)}

  /* No border on the panels: on a dark ground the separation is the shadow,
     as the style prescribes. Never a border AND a shadow. */
  .panel{background:var(--surface);border-radius:var(--radius-card);
    box-shadow:var(--shadow);margin-bottom:var(--gap)} /* taste-skill-ignore */
  .panel>header{display:flex;align-items:baseline;gap:14px;
    padding:14px 20px;border-bottom:1px solid var(--rule)}
  .panel>header h2{font-size:16px;flex:none}
  .panel>header .right{margin-left:auto;display:flex;align-items:baseline;
    gap:14px;font-size:var(--fs-small);color:var(--muted)}
  .content{padding:20px}

  /* ---- the download menu: it floats, so it may cast a shadow ------------ */
  .menu{position:relative}
  .menu>summary{list-style:none;cursor:pointer}
  .menu>summary::-webkit-details-marker{display:none}
  .menu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:10;min-width:230px;
    background:var(--raised);border-radius:var(--radius-card);padding:6px;
    box-shadow:0 16px 40px rgba(0,0,0,.45)}
  .menu-list a{display:flex;justify-content:space-between;gap:14px;padding:8px 10px;
    border-radius:4px;text-decoration:none}
  .menu-list a:hover{background:var(--control)}
  .menu-list button{display:block;width:100%;text-align:left;padding:8px 10px;
    border-radius:4px;color:var(--text)}
  .menu-list button:hover{background:var(--control)}
  .menu-list button.danger{color:var(--negative)}
  .menu.more summary{width:var(--control-h);padding:0;justify-content:center}
  .menu.more .menu-list{min-width:160px}
  .menu.more svg{fill:currentColor;stroke:none}
  .rename{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .rename input{height:38px;flex:1;min-width:200px;background:var(--surface);color:var(--text);
    border:1px solid var(--accent);border-radius:8px;padding:0 12px;font:inherit;font-size:20px}
  .rename input:focus{outline:none}
  .recording audio{width:100%;display:block}
  .go{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:var(--gap)}
  .go .rec-note{margin:0}
  .waiting-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;
    padding:9px 0;border-top:1px solid var(--rule)}
  .waiting-row:first-child{border-top:0}
  .waiting-row .n{color:var(--muted);font-size:var(--fs-small)}
  .menu-list a span{color:var(--muted);font-size:var(--fs-small)}

  /* ---- the new transcription screen -------------------------------------- */
  .split2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:stretch;
    margin-bottom:var(--gap)}
  .split2>.panel{margin-bottom:0;display:flex;flex-direction:column}
  .split2 .content{flex:1;display:flex;flex-direction:column}
  .drop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px;border:1px dashed var(--control);
    border-radius:var(--radius-card);cursor:pointer;min-height:236px}
  .drop:hover,.canvas.dragover .drop{border-color:var(--accent)}
  .drop b{display:block;font-size:18px;font-weight:600;margin-bottom:8px}
  .drop span{color:var(--muted);line-height:1.6}
  .drop .primary{margin-top:18px}
  .steps{margin:0 0 16px;padding-left:20px;color:var(--muted);line-height:1.6}
  .steps li{margin-bottom:6px}
  .steps b{color:var(--text);font-weight:500}
  .rec-foot{margin-top:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .rec-note{color:var(--muted);font-size:var(--fs-small);line-height:1.5;margin:14px 0 0}
  .field{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
  .field label{font-size:var(--fs-small);color:var(--muted)}
  .field input{height:38px;background:var(--surface);color:var(--text);
    border:1px solid var(--control);border-radius:8px;padding:0 12px;font:inherit}
  .field input:focus{outline:none;border-color:var(--accent)}
  .live{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--negative);flex:none;
    align-self:center;animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .live .clock{font-size:28px;font-variant-numeric:tabular-nums}
  .meter{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin-bottom:10px}
  .meter span{color:var(--muted);font-size:var(--fs-small)}
  .meter .track{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
  .meter .track i{display:block;height:100%;width:0;background:var(--chart-1);transition:width .08s linear}
  .meter.quiet-tab .track i{background:var(--warning)}

  .queue-row{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:12px 0;
    border-top:1px solid var(--rule);align-items:center}
  .queue-row:first-child{border-top:0;padding-top:0}
  .queue-row .qname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .queue-row .qstage{grid-column:1/-1;color:var(--muted);font-size:var(--fs-small)}
  .queue-row .bar{grid-column:1/-1}

  .recent{width:100%;border-collapse:collapse}
  .recent td{padding:10px 0;border-top:1px solid var(--rule);vertical-align:middle}
  .recent tr:first-child td{border-top:0}
  .recent tr{cursor:pointer}
  .recent tr:hover td{color:var(--text)}
  .recent td.n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;
    white-space:nowrap;padding-left:20px}
  .recent td:first-child{font-weight:500}

  /* the legend: every key is the mark itself, smaller */
  .legend{display:flex;gap:14px;font-size:var(--fs-small);color:var(--muted);
    margin-left:auto;align-items:center}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{display:block;flex:none}
  .k-speech{width:14px;height:8px;background:var(--chart-1);opacity:.5}
  .k-dropped{width:1px;height:11px;background:var(--negative)}
  .k-corrected{width:1px;height:11px;background:var(--accent)}

  /* ---- the call strip ---------------------------------------------------- */
  #strip{display:block;width:100%;height:72px;cursor:pointer}
  .strip-body{padding:14px 20px 10px}
  /* The minute labels live OUTSIDE the SVG: the band stretches to fill the
     width, and text stretched with it became a row of squashed, unreadable
     digits on a phone. */
  .axis{position:relative;height:18px;margin-top:6px;font-size:var(--fs-small);
    color:var(--muted);font-variant-numeric:tabular-nums}
  .axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .axis span:first-child{transform:none}
  .axis span:last-child{transform:translateX(-100%)}

  /* ---- the figures: one container, split by 1px lines -------------------- */
  .figures{display:grid;grid-template-columns:repeat(6,1fr);margin:0}
  .figures>div{padding:16px 20px;border-left:1px solid var(--rule)}
  .figures>div:first-child{border-left:0}
  .figures dt{font-size:var(--fs-small);color:var(--muted)}
  .figures dd{margin:4px 0 0;font-size:var(--fs-kpi);font-weight:400;
    font-variant-numeric:tabular-nums}
  .figures dd u{text-decoration:none;font-size:var(--fs-small);color:var(--muted);margin-left:3px}
  .figures dd.none{color:var(--muted)}

  /* Left, what is read, at a reading measure: 664px is about 75 characters at
     15px. Right, a rail with the call's details that stays in view while the
     text scrolls. Summary and transcript are three views of the SAME panel,
     so the transcript is never pushed below the fold. A rail does not have to
     end level with the column next to it. */
  .split{display:grid;grid-template-columns:664px 320px;gap:var(--gap);align-items:start}
  .split>*{min-width:0}
  .side{position:sticky;top:0}
  .glossary-body table{margin-top:12px}
  .voice-row{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;align-items:center;
    padding:9px 0;border-top:1px solid var(--rule)}
  .voice-row:first-of-type{border-top:0}
  .voice-row .tag{font-size:var(--fs-small);white-space:nowrap}
  .voice-row input{height:32px;min-width:0;background:var(--surface);color:var(--text);
    border:1px solid var(--control);border-radius:8px;padding:0 10px;font:inherit}
  .voice-row input:focus{outline:none;border-color:var(--accent)}
  .voice-row small{grid-column:2;color:var(--muted);font-size:var(--fs-small)}
  .glossary-body td{padding:8px 0}
  .foot-action{margin-top:16px}

  /* ---- the summary ------------------------------------------------------- */
  .summary{padding-top:14px}
  .summary h3{font-size:14px;margin:20px 0 6px;color:var(--muted);font-weight:500}
  .summary h3:first-child{margin-top:0}
  .summary p{margin:0 0 12px}
  .summary ul{margin:0 0 12px;padding-left:18px}
  .summary li{margin-bottom:5px}
  .summary>:last-child{margin-bottom:0}

    .recent,.recent tbody{display:block}

      padding:11px 0;border-top:1px solid var(--rule)}

    .recent td:first-child{grid-column:1/-1;margin-bottom:3px}
    .recent td.n{text-align:left;font-size:var(--fs-small);padding:0}
    .recent td.n:last-child{text-align:right}

      border-radius:var(--radius-control);color:var(--muted);font-size:var(--fs-small)}

    .figures{grid-template-columns:repeat(3,1fr)}
    .figures>div{padding:10px 12px;border-left:1px solid var(--rule);border-top:0}
    .figures>div:nth-child(3n+1){border-left:0}
    .figures>div:nth-child(n+4){border-top:1px solid var(--rule)}
    .figures dt{font-size:11px}
    .figures dd{font-size:16px}
    .axis span.minor{display:none}
    .legend{margin-left:0;width:100%;flex-wrap:wrap}
    #strip{height:60px}

    /* reading: the tabs and the player stay at hand while the text scrolls */
    /* The canvas's padding is outside the sticky area: without the negative
       top, the text shows through a strip above the header. */
    .reading>header{position:sticky;top:calc(-1 * var(--pad));z-index:3;background:var(--surface);
      border-radius:0;flex-wrap:nowrap;gap:10px;padding-left:16px;padding-right:12px}

    .reading .player .clock{display:none}
    .tab-long{display:none}
    .tab-short{display:inline}
    .reader{max-height:none;padding:4px 14px 16px}
    .tabs{gap:16px}
    .player button{width:36px;height:36px}
    .player svg{width:12px;height:12px}
    .lines p{flex-wrap:wrap;column-gap:10px;row-gap:1px;padding:8px 0 8px 9px}
    .lines time,.lines .who{width:auto;padding-top:0}
    .lines .who{max-width:60vw}
    .lines span.text{flex-basis:100%}
    .edit-actions,.lines.whos .edit-actions{margin-left:0}

    .form-row{grid-template-columns:1fr}
    .split2{grid-template-columns:1fr}
  }

const n1 = (n, one, many) => n + ' ' + (+n === 1 ? one : many);
const IT_RULES = [
  [/^(\d+) min$/, (_, n) => n + ' min'],
  [/^(\d+) calls?$/, (_, n) => n1(n, 'call', 'call')],
  [/^(\d+) minutes in all$/, (_, n) => n + ' minuti in tutto'],
  [/^(\d+) phrases? dropped$/, (_, n) => n1(n, 'frase scartata', 'frasi scartate')],
  [/^(\d+) phrases?$/, (_, n) => n1(n, 'frase', 'frasi')],
  [/^(\d+) match(?:es)?$/, (_, n) => n1(n, 'risultato', 'risultati')],
  [/^(\d+) lines?$/, (_, n) => n1(n, 'riga', 'righe')],
  [/^([\d:]+) talking$/, (_, t) => t + ' di parlato'],
  [/^(\d+) names? corrected in this transcript\.$/, (_, n) => n1(n, 'nome corretto', 'nomi corretti') + ' in questa trascrizione.'],
  [/^(\d+) voices told apart( on the call)?$/, (_, n, c) => n + ' voci separate' + (c ? ' nella call' : '')],
  [/^(\d+) invented phrases? dropped from silence$/, (_, n) => n1(n, 'frase inventata scartata dal silenzio', 'frasi inventate scartate dal silenzio')],
  [/^(\d+) names? corrected by the glossary$/, (_, n) => n1(n, 'nome corretto dal glossario', 'nomi corretti dal glossario')],
  [/^(\d+) lines? corrected by hand$/, (_, n) => n1(n, 'riga corretta a mano', 'righe corrette a mano')],
  [/^(\d+) phrases? still to check$/, (_, n) => n1(n, 'frase ancora da controllare', 'frasi ancora da controllare')],
  [/^recorded on two tracks: (\d+) lines? from you, (\d+) from the others$/,
    (_, a, b) => 'registrata su due tracce: ' + n1(a, 'riga tua', 'righe tue') + ', ' + b + ' degli altri'],
  [/^Strip of ([\d:]+) of recording: speech, dropped phrases and corrected lines\. Click to listen from that point\.$/,
    (_, t) => 'Striscia di ' + t + ' di registrazione: parlato, frasi scartate e righe corrette. Clicca per ascoltare da quel punto.'],
  [/^Added ([^·]+)$/, (_, w) => 'Aggiunta il ' + w],
  [/^([\d:]+) of audio$/, (_, t) => t + ' di audio'],
  [/^the transcription failed: (.*)$/, (_, e) => 'la trascrizione è fallita: ' + (translated(e) || e)],
  [/^About (\d+) (minutes|seconds) on this computer\.$/, (_, n, u) => 'Circa ' + n + (u === 'minutes' ? ' minuti' : ' secondi') + ' su questo computer.'],
  [/^Transcribe all (\d+)$/, (_, n) => 'Trascrivi tutte e ' + n],
  [/^Name for (.+)$/, (_, x) => 'Nome per ' + (translated(x) || x)],

  [/^([\d.,]+ [KMG]?B) saved$/, (_, s) => s + ' salvati'],

  [/^Listens to the recording again, without transcribing it again: about (\d+) (seconds|minutes?)(, plus a 32 MB download the first time)?\.$/,
    (_, n, u, dl) => 'Riascolta la registrazione, senza ritrascriverla: circa ' + n
      + (u === 'seconds' ? ' secondi' : (+n === 1 ? ' minuto' : ' minuti'))

    (_, m) => 'Non ancora chiesto. Lo scriverà ' + m + ', qui su questa macchina, in una ventina di secondi.'],
  [/^No call mentions “(.*)”\.$/, (_, q) => 'Nessuna call contiene “' + q + '”.'],
  [/^(\d+) names?, (\d+) of them found in your calls\. Names are corrected after transcription, not suggested before: given to Whisper as a prompt, they made the text worse instead of better\.$/,
    (_, a, b) => n1(a, 'nome', 'nomi') + ', ' + b + ' trovati nelle tue call. I nomi si correggono dopo la trascrizione, non si suggeriscono prima: dati a Whisper come prompt, peggioravano il testo invece di migliorarlo.'],

// The page is written in English. In Italian, every piece of interface text
// is looked up as it appears on screen: one dictionary, plus rules for the
// texts that carry a number. Calls are never touched: transcripts, summaries,
// names of calls and of people are marked as data and left as they are.
// Switching language reloads the page, so nothing half-translated stays.
const UI = store.get('sottovoce-ui') === 'it' ? 'it' : 'en';
document.documentElement.lang = UI;
const KEEP = '.data, [translate=no], .reader span.text, .reader .summary, .recent td:first-child, '
  + '.waiting-row>span:first-child, .qname, .hit span, .suspect span, script, style';

function T(s){
  if (UI !== 'it' || typeof s !== 'string') return s;
  const k = s.trim();
  if (!k) return s;
  const out = translated(k);
  if (out === null) return s;
  // "… scheda" + " on." becomes "… scheda" + ".": no space before the stop
  return (/^[.,;:]/.test(out) ? s.replace(/^\s+/, '') : s).replace(k, out);
}

function translated(k){
  if (Object.prototype.hasOwnProperty.call(IT, k)) return IT[k];
  for (const [rx, f] of IT_RULES){
    const m = rx.exec(k);
    if (m) return f(...m);
  }
  // "a · b · c": each part on its own, when every part is known or a number
  if (k.includes(' · ')){
    const parts = k.split(' · ');
    const t = parts.map(x => /^[\d:.,\s%-]*$/.test(x) ? x : translated(x));
    if (t.every(x => x !== null)) return t.join(' · ');
  }
  return null;
}

function translateTree(root){
  if (UI !== 'it') return;
  if (root.nodeType === 3){ translateText(root); return; }
  if (root.nodeType !== 1 || root.closest(KEEP)) return;
  translateAttrs(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => n.nodeType === 1 && n.matches(KEEP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  let n;
  while ((n = w.nextNode())){
    if (n.nodeType === 3) translateText(n); else translateAttrs(n);
  }
}

function translateText(n){
  const p = n.parentElement;
  if (!p || p.closest(KEEP)) return;
  const t = T(n.nodeValue);
  if (t !== n.nodeValue) n.nodeValue = t;
}

function translateAttrs(e){
  for (const a of ['placeholder', 'title', 'aria-label']){
    const v = e.getAttribute(a);
    if (v){ const t = T(v); if (t !== v) e.setAttribute(a, t); }
  }
}

if (UI === 'it'){
  new MutationObserver(ms => {
    for (const m of ms){
      if (m.type === 'characterData') translateText(m.target);
      else if (m.type === 'attributes') translateAttrs(m.target);
      else m.addedNodes.forEach(translateTree);
    }
  }).observe(document.body, {childList: true, subtree: true, characterData: true,
                             attributes: true, attributeFilter: ['placeholder', 'title', 'aria-label']});
  translateTree(document.body);
}

async function checkEngine(){
  try{
    const d = await (await fetch('/api/status')).json();
    const light = $('.light'), t = $('#engine-text');
    voicesAvail = !!d.voices;
    voicesReady = !!d.voices_ready;
    const os = $('.options-summary span');
    if (os) os.textContent = optionsSummary();
    const vt = $('#voices-toggle');
    if (vt){
      vt.hidden = !voicesAvail;
      vt.querySelector('small').textContent = voicesText();
    }
    if (d.error){ light.className = 'light no'; t.textContent = d.error; return; }
    // Started with --no-model: reading old calls, nothing to transcribe with.
    if (d.off){
      off = true;
      t.textContent = 'browsing only, Whisper not loaded';
      refreshHomeButtons();
      return;
    }
    if (d.ready){
      ready = true;
      light.className = 'light ok';
      t.textContent = d.model.split('/').pop() + ' · ready';
      refreshHomeButtons();
    } else setTimeout(checkEngine, 1500);
  } catch(e){ setTimeout(checkEngine, 2000); }
}

async function checkLLM(){
  try{ llm = await (await fetch('/api/llm')).json(); }
  catch(e){ llm = {available:false}; }
}

// The server knows what is waiting and what is being transcribed: the page
// asks again while something is moving, so the list stays true after a
// reload, or with a transcription started from another device.
let refreshing = null, pendingShown = null;
async function loadCalls(){
  try{ calls = (await (await fetch('/api/history')).json()).history || []; }
  catch(e){ return; }
  drawList();
  if (view === 'home'){ drawRecent(); drawWaiting(); }
  clearTimeout(refreshing);
  if (calls.some(v => v.status === 'queued' || v.status === 'transcribing'))
    refreshing = setTimeout(loadCalls, 1500);
  // The call on screen is waiting or being transcribed: follow it.
  if (view === 'call' && pendingShown){
    const v = calls.find(x => x.folder === pendingShown.folder);
    if (v && v.status !== pendingShown.status) openCall(v.folder);
    else if (v && v.status === 'transcribing') updatePending(v);
  }
}

// The tag a call carries in the list until it is transcribed.
function stateTag(v){
  const st = v.status;
  if (st === 'waiting') return '<span class="state waiting">Not transcribed</span>';
  if (st === 'failed') return '<span class="state failed">Failed</span>';
  if (st === 'queued') return '<span class="state working">Queued</span>';
  const pct = v.expected ? Math.min(97, Math.round(100 * (v.elapsed || 0) / v.expected)) : null;
  return '<span class="state working">Transcribing' + (pct !== null ? ' ' + pct + '%' : '…') + '</span>';
}

function drawList(){
  const l = $('#list');
  if ($('#search').value.trim().length >= 2) return;      // a search is on screen
  l.textContent = '';
  // Files still on their way to the server come first.
  for (const name of adding){
    const b = el('div', 'item adding');
    b.innerHTML = '<span class="name">' + esc(name) + '</span><span class="meta">adding…</span>';
    l.append(b);
  }
  if (!calls.length && !adding.length){
    const p = el('p', 'quiet');
    p.textContent = 'No calls yet.';
    l.append(p);
    return;
  }
  for (const v of calls){
    const b = el('button', 'item');
    b.type = 'button';
    if (view === 'call' && v.folder === openNow) b.setAttribute('aria-current', 'true');
    const n = el('span', 'name');
    n.textContent = v.name || v.original || v.folder;
    n.classList.add('data');
    // A count only on what asks to be looked at, and it names what it counts:
    // never a bare number next to a name.
    const dropped = (v.phantoms_dropped || []).length;
    const m = el('span', 'meta');
    const st = v.status || 'done';
    const mins = v.duration_s ? '<span class="num">' + Math.max(1, Math.round(v.duration_s / 60))
      + '</span> min' : '';
    if (st === 'done'){
      m.innerHTML = '<span class="num">' + esc((v.transcribed_at || '').slice(0, 10)) + '</span>'
        + ' · ' + mins
        + ' · <span class="num">' + thousands(v.words) + '</span> words'
        + (dropped ? ' · <span class="dropped">' + esc(plural(dropped, 'phrase dropped', 'phrases dropped')) + '</span>' : '');
    } else {
      m.innerHTML = '<span class="num">' + esc((v.uploaded_at || v.transcribed_at || '').slice(0, 10)) + '</span>'
        + (mins ? ' · ' + mins : '') + ' · ' + stateTag(v);
    }
    b.append(n, m);
    b.onclick = () => openCall(v.folder);
    l.append(b);
  }
}

let searchWait;
$('#search').oninput = e => {
  clearTimeout(searchWait);
  const q = e.target.value.trim();
  if (q.length < 2){ drawList(); return; }
  searchWait = setTimeout(() => search(q), 250);
};

async function search(q){
  let d;
  try{ d = await (await fetch('/api/search?q=' + encodeURIComponent(q))).json(); }
  catch(e){ return; }
  const l = $('#list');
  l.textContent = '';
  if (!d.results.length){
    const p = el('p', 'quiet');
    p.textContent = 'No call mentions “' + q + '”.';
    l.append(p);
    return;
  }
  const tot = el('p', 'group');
  tot.innerHTML = '<span class="num">' + esc(plural(d.total, 'match', 'matches')) + '</span> in '
    + '<span class="num">' + esc(plural(d.results.length, 'call', 'calls')) + '</span>';
  l.append(tot);
  for (const r of d.results){
    const g = el('p', 'group');
    g.textContent = r.folder;
    g.classList.add('data');
    l.append(g);
    for (const x of r.lines){
      const b = el('button', 'hit');
      b.type = 'button';
      b.innerHTML = '<time class="num">' + esc(x.minute) + '</time>'
        + '<span>' + highlight(x.snippet, q) + '</span>';
      b.onclick = () => openCall(r.folder, x.seconds);
      l.append(b);
    }
  }
}

// Highlighting without regular expressions: the query may contain characters
// that mean something else in a regex, and escaping them is a roundabout way
// of doing what indexOf does better.
function highlight(s, q){
  const out = [], L = s.toLowerCase(), Q = q.toLowerCase();
  let i = 0;
  for(;;){
    const k = L.indexOf(Q, i);
    if (k < 0){ out.push(esc(s.slice(i))); break; }
    out.push(esc(s.slice(i, k)), '<mark>', esc(s.slice(k, k + Q.length)), '</mark>');
    i = k + Q.length;
  }
  return out.join('');
}
