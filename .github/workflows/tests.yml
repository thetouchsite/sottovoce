name: tests

on:
  push:
  pull_request:

# No GPU and no model on GitHub's machines: everything is tested on the
# fictional calls in examples/, with the server started --no-model.
# Transcription itself is checked by hand, on a machine with a GPU.

jobs:
  engine-and-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile server.py transcribe.py summary.py voices.py research/benchmark.py research/compare.py research/voices_ami.py research/two_tracks.py research/llm.py research/wer.py installer/gpu.py
      - run: python -m pytest tests/test_engine.py tests/test_api.py tests/test_installer.py -q

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_page.py -q

  # The shell scripts, for syntax and the usual mistakes.
  launchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh start.sh installer/install.sh installer/uninstall.sh
      - run: shellcheck install.sh start.sh installer/install.sh installer/uninstall.sh

  # The one-command install, end to end, as a user runs it: from this
  # checkout instead of the latest release, with PyTorch for the CPU (no GPU
  # here). Twice, because the second run is how a user updates; then the
  # server must answer with the example calls, and the uninstall must leave
  # the calls folder alone.
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, torch: cpu}
          - {os: ubuntu-latest, torch: cpu}
          - {os: macos-latest, torch: pypi}
    runs-on: ${{ matrix.os }}
    env:
      SOTTOVOCE_SOURCE: ${{ github.workspace }}
      SOTTOVOCE_TORCH: ${{ matrix.torch }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        shell: powershell
        env:
          SOTTOVOCE_DIR: ${{ runner.temp }}/sottovoce
          SOTTOVOCE_HOME: ${{ runner.temp }}/calls
        run: |
          & .\installer\install.ps1
          & .\installer\install.ps1
          $app = Join-Path $env:SOTTOVOCE_DIR "app"
          $server = Start-Process (Join-Path $app ".venv\Scripts\python.exe") -WorkingDirectory $app -PassThru `
            -ArgumentList "server.py", "--no-model", "--data", "examples/transcripts"
          $calls = $null
          foreach ($i in 1..60) {
            try { $calls = Invoke-RestMethod "http://127.0.0.1:8200/api/history"; break } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $server.Id -Force
          if (@($calls.history).Count -lt 1) { throw "the installed server did not list the example calls" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:SOTTOVOCE_DIR "uninstall.ps1")
          if (Test-Path $env:SOTTOVOCE_DIR) { throw "the program folder is still there" }
          if (-not (Test-Path (Join-Path $env:SOTTOVOCE_HOME "glossary.txt"))) { throw "the calls folder was removed" }
      - if: runner.os != 'Windows'
        env:
          SOTTOVOCE_DIR: ${{ runner.temp }}/sottovoce
          SOTTOVOCE_HOME: ${{ runner.temp }}/calls
        run: |
          bash installer/install.sh
          bash installer/install.sh
          app="$SOTTOVOCE_DIR/app"
          "$app/.venv/bin/python" "$app/server.py" --no-model --data "$app/examples/transcripts" &
          server=$!
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8200/api/history -o calls.json; then break; fi
            sleep 1
          done
          kill "$server"
          wait "$server" || true
          grep -q '"name"' calls.json
          bash "$SOTTOVOCE_DIR/uninstall.sh"
          test ! -e "$SOTTOVOCE_DIR"
          test -f "$SOTTOVOCE_HOME/glossary.txt"
