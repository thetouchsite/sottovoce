name: Feature request
description: Something Sottovoce should do, or do differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/thetouchsite/sottovoce/blob/master/ROADMAP.md) first: it may already be there, with the reasons. And keep real calls and client names out of it: issues are public.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way. A real situation is worth more than a solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. If another tool does it well, a link helps.

  - type: textarea
    id: done
    attributes:
      label: How we'd know it's done
      description: Optional. For a change to how calls are transcribed, how it could be measured.
